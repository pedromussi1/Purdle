name: Daily puzzle

on:
  # 00:05 UTC every day — slightly after midnight so the new date is stable.
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD); blank = today UTC"
        required: false
        default: ""
      force:
        description: "Overwrite an existing puzzle for this date"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate puzzle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/generate_puzzle.py $ARGS

      - name: Commit puzzle
        run: |
          git config user.name "purdle-bot"
          git config user.email "actions@github.com"
          git add public/puzzles/wordle/
          if git diff --staged --quiet; then
            echo "No new puzzle file to commit."
          else
            git commit -m "puzzle: $(date -u +%F)"
            git push
          fi
