name: Daily puzzle

on:
  # 00:05 UTC every day — slightly after midnight so the new date is stable.
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD); blank = today UTC"
        required: false
        default: ""
      force:
        description: "Overwrite an existing puzzle for this date"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate puzzle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/generate_puzzle.py $ARGS

      - name: Commit puzzle
        run: |
          git config user.name "purdle-bot"
          git config user.email "actions@github.com"
          git add public/puzzles/wordle/
          if git diff --staged --quiet; then
            echo "No new puzzle file to commit."
          else
            git commit -m "puzzle: $(date -u +%F)"
            git push
          fi

      - name: Heartbeat Supabase
        # Supabase pauses free-tier projects after 7 days of database
        # inactivity. This daily PATCH keeps the project warm. Skipped
        # silently when the Supabase secrets aren't set (v1 mode).
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/heartbeat?id=eq.singleton" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%FT%TZ)\"}" \
          && echo "Supabase pinged" \
          || echo "Heartbeat failed (non-fatal)"
