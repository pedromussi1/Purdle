name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily-puzzle commits use GITHUB_TOKEN, which by design does NOT re-trigger
  # `push` events. Hook the deploy onto its completion so the new puzzle ships
  # to Pages without a manual nudge.
  workflow_run:
    workflows: ["Daily puzzle", "Daily quartet", "Daily ladder", "Daily synonymy", "Build synonymy graph"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid stomping on a deploy in progress; the most recent push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # When triggered by Daily-puzzle finishing, only deploy if it actually
    # produced a successful run. Other triggers (push, manual) always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        # Vite reads VITE_-prefixed env vars at build time and inlines them
        # into the JS bundle. These keys are public-by-design (RLS gates the
        # actual data); GitHub secrets are used only as a config carrier.
        # If the secrets aren't set, the bundle still builds and the app
        # falls back to local-stats-only mode (no sign-in UI).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
