<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#6aaa64" />

    <!-- PWA / iOS install support. The manifest link is auto-injected by
         vite-plugin-pwa during build, but iOS Safari only honors these
         apple-* tags for the home-screen icon and standalone experience. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Purdle" />

    <title>Purdle — a daily word puzzle generated by an LLM</title>
    <meta
      name="description"
      content="Purdle is a daily five-letter word puzzle, six guesses, generated entirely by an automated LLM + ML pipeline. No human picks the answer. Free to play, free to host."
    />

    <!-- Open Graph (Slack, Discord, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Purdle" />
    <meta
      property="og:description"
      content="A daily five-letter word puzzle generated by an automated LLM + ML pipeline. No human picks the answer."
    />
    <meta property="og:url" content="https://purdle.app/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/pedromussi1/Purdle/main/docs/screenshot.png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Purdle" />
    <meta
      name="twitter:description"
      content="A daily five-letter word puzzle generated by an automated LLM + ML pipeline."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/pedromussi1/Purdle/main/docs/screenshot.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
